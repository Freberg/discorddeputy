apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher-steam
spec:
  strategy:
    type: RollingUpdate
  template:
    spec:
      containers:
        - image: fetcher-steam
          imagePullPolicy: Always
          name: fetcher-steam
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC"
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username 
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password 
          ports:
            - containerPort: 8084
              name: main
            - containerPort: 7084
              name: monitor
          resources:
            requests:
              memory: 256Mi
              cpu: "1"
            limits:
              memory: 256Mi
              cpu: "2"
